<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ballymander</title>
  <!-- The mural's salamander on its own, squared and backed so it survives a
       dark tab strip (scripts/make_favicon.py). -->
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/favicon-180.png">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <!-- The name is in the artwork, so the heading is the image: the alt text
         is the wordmark it draws. -->
    <h1 class="brand">
      <img src="img/ballymander-wide.png" alt="Ballymander" width="1619" height="978">
    </h1>

    <div class="ctl-buttons">
      <button id="ctl-go" type="button" disabled>GO</button>
      <button id="ctl-pause" type="button" disabled>PAUSE</button>
      <button id="ctl-stop" type="button" disabled>STOP</button>
    </div>

    <div class="ctl-grid">
      <!-- Boundaries that actually exist, as a starting point. Only offered
           while stopped: once a run moves a zone the map is no longer real. -->
      <label for="ctl-real" class="real-only">Real-life regions</label>
      <select id="ctl-real" class="real-only">
        <option value="none" selected>None</option>
        <option value="westminster">Westminster</option>
        <option value="assembly">Assembly</option>
        <option value="council">Council</option>
      </select>
      <!-- The election every drawn map holds. The seat count and the seat bonus
           only apply to STV. -->
      <label for="ctl-election-type">Election type</label>
      <select id="ctl-election-type">
        <option value="fptp" selected>FPTP</option>
        <option value="stv">STV</option>
      </select>
      <label for="ctl-n">Regions</label>
      <input id="ctl-n" type="number" min="1" max="500" step="1" value="18">
      <label for="ctl-seats" class="stv-only" hidden>Elected/Region</label>
      <!-- No upper bound: one region electing everyone is a legitimate thing to
           look at, and is roughly what a national PR list would do. -->
      <input id="ctl-seats" class="stv-only" type="number" min="1" step="1"
             value="5" hidden>
      <!-- How much a seat is worth against a quota of leftover votes, when a
           party variable is drawing for seats. One election, one bonus. -->
      <label for="ctl-bonus" class="stv-only" hidden>Seat bonus <span
        id="ctl-bonus-value">2</span></label>
      <input id="ctl-bonus" class="stv-only" type="range" min="1" max="5" step="0.5"
             value="2" hidden>
      <!-- Both of the ways a ballot differs from the voters behind it, on one
           line: who deserts a party that cannot win, and who is not on the
           ballot at all (standing v0, a threshold per party per election). -->
      <div class="ctl-checks">
        <label class="fptp-only" for="ctl-tactical">
          <input id="ctl-tactical" type="checkbox" checked> Tactical voting</label>
        <label for="ctl-standing">
          <input id="ctl-standing" type="checkbox" checked> Standing threshold</label>
      </div>
      <!-- Which parties are on the ballot, and which have merged. Built by
           app.js; its state outlives a run. -->
      <div id="party-editor" hidden></div>
      <label for="ctl-seed">Random seed</label>
      <input id="ctl-seed" type="number" min="0" step="1" value="1">
      <label for="ctl-temp">Temperature</label>
      <input id="ctl-temp" type="number" min="0.01" max="100" step="0.1" value="1">
      <label for="ctl-popw">Population <span id="ctl-popw-value">1</span></label>
      <input id="ctl-popw" type="range" min="-1" max="1" step="0.02" value="0" data-weight>
      <label for="ctl-shape">Land shape <span id="ctl-shape-value">1</span></label>
      <input id="ctl-shape" type="range" min="-1.02" max="1" step="0.02" value="0"
             data-weight data-off>
      <label for="ctl-pshape">People shape <span id="ctl-pshape-value">1</span></label>
      <input id="ctl-pshape" type="range" min="-1.02" max="1" step="0.02" value="0"
             data-weight data-off>
      <label for="ctl-cut">Cut edges <span id="ctl-cut-value">1</span></label>
      <input id="ctl-cut" type="range" min="-1.02" max="1" step="0.02" value="0"
             data-weight data-off>
    </div>

    <!-- One collapsible block per entry in DEMOGRAPHICS, built by app.js. A new
         demographic is its data plus one entry there, and needs no markup. -->
    <!-- What the run is steered by: as many or as few as are wanted, each one
         a party or a demographic. Built by app.js; the page starts with one. -->
    <div id="variables"></div>
    <div class="add-variable">
      <button id="ctl-add-open" type="button" class="add-open">
        <span class="add-plus" aria-hidden="true">+</span>Add variable</button>
      <div id="ctl-add" class="add-menu" role="menu" aria-label="Add variable" hidden></div>
    </div>


    <div class="ctl-grid ctl-more">
      <!-- How fast the run goes, and nothing else: the frame rate, the two
           step counts and the recombination interval were four ways of saying
           it, three of which only ever wanted one setting. Logarithmic, 0.01 to
           10, and 1 is ten thousand optimiser steps a second. -->
      <label for="ctl-speed">Simulation speed <span id="ctl-speed-value">1</span></label>
      <input id="ctl-speed" type="range" min="-2" max="1" step="0.02" value="0">
    </div>

    <p class="hint">Hover a zone for its figures, and its region's.</p>
  </div>

  <div id="results" hidden>
    <!-- The panel's name is in the artwork, as the app's own is. -->
    <h2 class="results-title">
      <img src="img/results-title.png" alt="Results" width="551" height="220">
    </h2>
    <!-- The whole map, or one region's count in detail. -->
    <div class="view-switch" role="group" aria-label="View" hidden>
      <button id="view-overall" type="button" class="is-active" aria-pressed="true">
        Overall</button>
      <button id="view-region" type="button" aria-pressed="false">Region</button>
    </div>

    <div id="overall">
    <dl id="run">
      <!-- What a person can actually read something into. The shape penalties
           and the cut-edge count were figures the algorithm cares about and
           nobody else; they are still on the model for the tests. -->
      <div class="run-wide"><dt>Phase</dt><dd id="run-phase">&mdash;</dd></div>
      <div><dt>Flips</dt><dd id="run-moves">&mdash;</dd></div>
      <div><dt>ReCom</dt><dd id="run-recom">&mdash;</dd></div>
      <div id="run-score-row"><dt>Score</dt><dd id="run-score">&mdash;</dd></div>
      <div><dt>Best score</dt><dd id="run-best">&mdash;</dd></div>
      <div><dt>Max pop dev</dt><dd id="run-dev">&mdash;</dd></div>
    </dl>

    <!-- Election mode: seats by party. Filled by app.js; the caption names the
         segment under the pointer, so the chart itself needs no labels. -->
    <div id="pie" hidden>
      <div class="pie-title">Seats per party</div>
      <svg id="pie-svg" viewBox="-1.05 -1.05 2.1 2.1" aria-label="Seats by party"></svg>
      <div id="pie-caption">&nbsp;</div>
    </div>

    <div id="results-list" hidden>
      <select id="bars-stat">
        <option value="pop" selected>Population</option>
        <option value="land">Land shape</option>
        <option value="people">People shape</option>
        <option value="cut">Cut edges</option>
      </select>
      <div id="results-scroll">
        <div id="bars"></div>
      </div>
      <div id="bars-axis">
        <span id="bars-min"></span>
        <span id="bars-max"></span>
      </div>
    </div>
    </div>

    <!-- One region's election. Click the map to choose which. -->
    <div id="region-view" hidden>
      <div id="region-title">
        <span id="region-swatch" aria-hidden="true"></span><span id="region-name">&mdash;</span>
      </div>
      <div id="region-seats">&mdash;</div>
      <svg id="region-pie" viewBox="-1.05 -1.05 2.1 2.1" aria-label="Votes by party" hidden></svg>
      <div id="region-stages" hidden></div>
      <div id="region-caption">&nbsp;</div>
      <p id="region-hint">Click a zone on the map to show its region.</p>
    </div>
  </div>

  <div id="status" role="status">Loading zones&hellip;</div>

  <div id="tooltip" hidden>
    <div class="tt-name"></div>
    <div class="tt-pop"><span class="tt-pop-value"></span> <span class="tt-unit">people</span></div>
    <div class="tt-demo"></div>
    <div class="tt-party"></div>
    <div class="tt-region" hidden>
      <div class="tt-region-name"></div>
      <div class="tt-region-pop">
        <span class="tt-region-pop-value"></span> <span class="tt-unit">people</span>
      </div>
      <div class="tt-region-demo"></div>
      <div class="tt-region-party"></div>
    </div>
  </div>

  <script src="vendor/maplibre-gl.js"></script>
  <script src="graph.js"></script>
  <script src="regions.js"></script>
  <script src="app.js"></script>
</body>
</html>
